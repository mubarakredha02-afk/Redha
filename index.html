<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintasan Link Saya</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        p.bio {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-card:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        .link-card i {
            font-size: 1.2rem;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profil (Ganti URL gambar di bawah) -->
        <img src="https://drive.google.com/file/d/1Gd_rMNJyktt1pHLVNSC_WmtX1tjPHRFR/view?usp=sharing">

        <!-- Nama & Deskripsi -->
        <h1>Nama Anda / Brand</h1>
        <p class="bio">Digital Creator | Welcome to my official links ✨</p>

        <!-- Daftar Link -->
        <div class="links-container">
            <a href="https://instagram.com/username_kamu" target="_blank" class="link-card">
                <i class="fab fa-instagram"></i> Instagram
            </a>

            <a href="https://tiktok.com/@username_kamu" target="_blank" class="link-card">
                <i class="fab fa-tiktok"></i> TikTok
            </a>

            <a href="https://wa.me/6281234567890" target="_blank" class="link-card">
                <i class="fab fa-whatsapp"></i> WhatsApp Saya
            </a>

            <a href="https://youtube.com/@username_kamu" target="_blank" class="link-card">
                <i class="fab fa-youtube"></i> Channel YouTube
            </a>

            <a href="https://websitekamu.com" target="_blank" class="link-card">
                <i class="fas fa-globe"></i> Website Utama
            </a>
        </div>

        <footer>
            &copy; 2026 Dipublikasikan via GitHub Pages
        </footer>
    </div>

</body>
</html>
