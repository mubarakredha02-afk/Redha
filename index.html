<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintasan Link Saya</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang diperbarui dengan foto gedung dan overlay gelap tipis agar teks tetap terbaca */
            background: linear-gradient(rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.4)), 
                        url('https://lh3.googleusercontent.com/d/1u6PhXcRN61vZ5N1mPUpT73ODFBkOaI43') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p.bio {
            font-size: 0.9rem;
            color: #e2e8f0;
            margin-bottom: 25px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .link-card:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }

        .link-card i {
            font-size: 1.2rem;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #cbd5e1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profil -->
        <img class="profile-img" src="https://lh3.googleusercontent.com/d/1Gd_rMNJyktt1pHLVNSC_WmtX1tjPHRFR" alt="Foto Profil">

        <!-- Nama & Deskripsi -->
        <h1>Aplikasi Pengelola Arsip<br>Kantor Pertanahan Kabupaten Tabalong</h1>

        <!-- Daftar Link -->

                <i class="fas fa-file-excel"></i> BEcaRi warKAH (Spreadsheet)
            </a>

            <a href="https://docs.google.com/forms/d/1K13QhLD7HG2HkBaaanWqHLrgLRqjudUdOUN1UPvTAIk/edit?usp=drive_web&ouid=111035568398373975578">
                <i class="fab fa-tiktok"></i> Link Entri DI 208 (Google Form)
            </a>

            <a href="https://wa.me/6281234567890" target="_blank" rel="noopener noreferrer" class="link-card">
                <i class="fab fa-whatsapp"></i> WhatsApp Saya
            </a>

            <a href="https://youtube.com/@username_kamu" target="_blank" rel="noopener noreferrer" class="link-card">
                <i class="fab fa-youtube"></i> Channel YouTube
            </a>

            <a href="https://websitekamu.com" target="_blank" rel="noopener noreferrer" class="link-card">
                <i class="fas fa-globe"></i> Website Utama
            </a>
        </div>

        <footer>
            &copy; 2026 Dipublikasikan via GitHub Pages
        </footer>
    </div>

</body>
</html>
