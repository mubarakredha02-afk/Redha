<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEcaRi warKAH - Kantor Pertanahan Tabalong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        p.bio {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .sheet-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }

        /* Tinggi 140px disesuaikan agar pas dengan rentang A10:C10 */
        .sheet-frame {
            width: 100%;
            height: 140px; 
            border: none;
        }

        footer {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profil -->
        <img class="profile-img" src="https://lh3.googleusercontent.com/d/1Gd_rMNJyktt1pHLVNSC_WmtX1tjPHRFR" alt="Logo">

        <!-- Judul -->
        <h1>Aplikasi Pengelola Arsip<br>Kantor Pertanahan Tabalong</h1>
        <p class="bio">Welcome To Aplikasi BERKAH (BEcaRi warKAH)</p>

        <!-- Google Sheet Rentang A10:C10 -->
        <div class="sheet-wrapper">
            <iframe class="sheet-frame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTLXvjA5GsbRKW0CK9y9GvL4kRc0fMF1ucofxcHYY5hTdm7I95BDj9EGNnT0_Ar-n6sRvKtZ2fT35Sv/pubhtml?gid=1081354575&amp;single=true&amp;widget=false&amp;headers=false&amp;range=A10:C10"></iframe>
        </div>

        <footer>
            &copy; 2026 Kantor Pertanahan Tabalong &bull; BEcaRi warKAH
        </footer>
    </div>

</body>
</html>
